name: Spyder Wallet - Intel TestFlight (Cloud Signing)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown in TestFlight'
        required: true
        default: '1.3.0'
        type: string

permissions:
  contents: read

concurrency:
  group: spyder-wallet-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & Upload (Intel macOS, Automatic Signing)
    runs-on: macos-26-intel
    timeout-minutes: 75

    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta
      ARCHIVE_PATH: ${{ runner.temp }}/SpyderWallet.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/SpyderWalletExport

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Intel runner and select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          echo "Architecture: $(uname -m)"
          if [ "$(uname -m)" != "x86_64" ]; then
            echo '::error::Expected Intel runner (x86_64)'
            exit 1
          fi
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            echo '::error::Xcode 26 not found on Intel runner'
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify existing App Store Connect credentials
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for key in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done
          echo 'App Store Connect credentials are configured.'
          echo 'No P12 certificate or .mobileprovision secret is required by this workflow.'

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml || { echo '::error::project.yml not found'; exit 1; }
          xcodegen generate
          test -d "$PROJECT"
          test -f Config/Console-Info.plist

      - name: Compile Spyder Wallet (without signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=NO \
            build

      - name: Prepare App Store Connect API key
        id: asc
        shell: bash
        env:
          API_KEY_VALUE: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc-private"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ['API_KEY_VALUE'].strip()
          try:
              contents = raw.encode('utf-8') if 'BEGIN PRIVATE KEY' in raw else base64.b64decode(''.join(raw.split()), validate=True)
              txt = contents.decode('utf-8')
              assert '-----BEGIN PRIVATE KEY-----' in txt and '-----END PRIVATE KEY-----' in txt
          except Exception as exc:
              raise SystemExit('APP_STORE_CONNECT_API_KEY_BASE64 is not a valid .p8 key or base64-encoded .p8') from exc
          pathlib.Path(os.environ['KEY_PATH']).write_text(txt.strip() + '\n', encoding='utf-8')
          PY
          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive for iOS with automatic Apple signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.asc.outputs.path }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}"
          echo "Version $MARKETING_VERSION ($BUILD_NUMBER)"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            SUPPORTS_MACCATALYST=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive

      - name: Verify archive identity and display name
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$ARCHIVE_PATH/Products/Applications/Console.app/Info.plist"
          test -f "$INFO_PLIST"
          ACTUAL_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")"
          if [ "$ACTUAL_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "::error::Wrong bundle ID: $ACTUAL_BUNDLE"
            exit 1
          fi
          if [ "$ACTUAL_NAME" != 'Spyder Wallet' ]; then
            echo "::error::Wrong display name: $ACTUAL_NAME"
            exit 1
          fi
          echo "Verified: $ACTUAL_NAME ($ACTUAL_BUNDLE)"

      - name: Create export settings for TestFlight
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export and upload directly to TestFlight
        shell: bash
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.asc.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo 'Upload command finished. Check build processing status in App Store Connect.'

      - name: Signing troubleshooting guidance
        if: failure()
        shell: bash
        run: |
          echo '::notice::If automatic signing failed with cloud-managed certificate permission errors, verify the App Store Connect API key role and cloud-managed distribution certificate access. The absence of a P12 secret is no longer the blocking condition.'
