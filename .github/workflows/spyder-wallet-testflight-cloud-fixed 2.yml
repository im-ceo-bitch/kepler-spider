name: Spyder Wallet - TestFlight Cloud Signing

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize executions so two runs cannot choose the same Apple build number.
# Keep this workflow file/path unchanged between releases.
concurrency:
  group: spyder-wallet-testflight-cloud
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload Spyder Wallet to TestFlight
    runs-on: macos-26-intel
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.spyder.wallet
      DISPLAY_NAME: Spyder Wallet
      # The app version is read from project.yml. BUILD_NUMBER comes from Apple.

    steps:
      - name: Check out Spyder Wallet
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 on Intel
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 || { echo '::error::Expected an Intel macOS runner'; exit 1; }
          XCODE_APP=/Applications/Xcode_26.6.app
          test -d "$XCODE_APP/Contents/Developer" || { echo '::error::Xcode 26.6 is not installed'; exit 1; }
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcrun --sdk iphoneos --show-sdk-version

      - name: Read manually managed marketing version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('project.yml').read_text()
          versions = re.findall(r'^\s*MARKETING_VERSION:\s*["\']?([0-9]+(?:\.[0-9]+){1,2})["\']?\s*$', source, re.M)
          if len(versions) != 1:
              raise SystemExit('Expected exactly one MARKETING_VERSION in project.yml (for example 1.0)')
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as f:
              f.write(f'APP_VERSION={versions[0]}\n')
          print(f'Manually managed app version: {versions[0]}')
          PY

      - name: Validate App Store Connect API credentials (NO P12)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for variable in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [[ -n "${!variable:-}" ]] || { echo "::error::Missing GitHub secret: $variable"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/spyder-private"
          chmod 700 "$RUNNER_TEMP/spyder-private"
          python3 - <<'PY'
          import os, base64, binascii
          from pathlib import Path
          raw = os.environ['APP_STORE_CONNECT_API_KEY_BASE64'].strip()
          if raw.startswith('-----BEGIN PRIVATE KEY-----'):
              key = raw.encode('ascii')
          else:
              try:
                  key = base64.b64decode(''.join(raw.split()), validate=True)
              except (binascii.Error, ValueError):
                  raise SystemExit('APP_STORE_CONNECT_API_KEY_BASE64 is not valid Base64')
          if b'-----BEGIN PRIVATE KEY-----' not in key:
              raise SystemExit('The secret must contain a .p8 App Store Connect private key (not a .cer or .p12).')
          path = Path(os.environ['RUNNER_TEMP']) / 'spyder-private' / ('AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8')
          path.write_bytes(key)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'ASC_KEY_PATH={path}\n')
          PY
          openssl pkey -in "$RUNNER_TEMP/spyder-private/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" -noout >/dev/null 2>&1 || {
            echo '::error::Invalid App Store Connect .p8 private key.'; exit 1;
          }
          echo 'API key format verified. No P12 or provisioning profile is required in Secrets.' >> "$GITHUB_STEP_SUMMARY"

      - name: Reserve next build number from App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          node --version
          # Read all previously uploaded builds from Apple, including those
          # uploaded by workflows whose run_number has since been reset.
          # If the API is unavailable, stop BEFORE building rather than reuse 1.
          node --input-type=module <<'JS'
          // Determine the next unique CFBundleVersion from App Store Connect.
          // Node.js 18+ built-ins only; no P12 or provisioning profile needed.
          import { createPrivateKey, sign } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          
          const API = 'https://api.appstoreconnect.apple.com';
          const { APP_STORE_CONNECT_KEY_ID: kid, APP_STORE_CONNECT_ISSUER_ID: iss,
                  ASC_KEY_PATH: keyPath, BUNDLE_ID: bundleID,
                  GITHUB_ENV: envFile, GITHUB_RUN_NUMBER: runNum } = process.env;
          for (const [name, value] of Object.entries({ kid, iss, keyPath, bundleID, envFile, runNum })) {
            if (!value) throw new Error(`Required build-number parameter is missing: ${name}`);
          }
          const json64 = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const payload = { iss, iat: now - 30, exp: now + 600, aud: 'appstoreconnect-v1' };
          const unsigned = `${json64({ alg: 'ES256', kid, typ: 'JWT' })}.${json64(payload)}`;
          const key = createPrivateKey(readFileSync(keyPath));
          const jwt = `${unsigned}.${sign('sha256', Buffer.from(unsigned),
            { key, dsaEncoding: 'ieee-p1363' }).toString('base64url')}`;
          
          async function getPage(url) {
            const target = new URL(url, API);
            if (target.protocol !== 'https:' || target.hostname !== 'api.appstoreconnect.apple.com') {
              throw new Error('Refusing a non-Apple API pagination URL');
            }
            for (let retry = 0; retry < 4; retry++) {
              const resp = await fetch(target, {
                headers: { Authorization: `Bearer ${jwt}`, Accept: 'application/json' },
                signal: AbortSignal.timeout(20000),
              });
              if (resp.ok) return await resp.json();
              if ((resp.status === 429 || resp.status >= 500) && retry < 3) {
                await new Promise(resolve => setTimeout(resolve, 1500 * (retry + 1)));
                continue;
              }
              throw new Error(`App Store Connect API returned HTTP ${resp.status}. Verify that the API key can read Apps and Builds.`);
            }
            throw new Error('Cannot retrieve App Store Connect builds');
          }
          
          const appsURL = new URL('/v1/apps', API);
          appsURL.searchParams.set('filter[bundleId]', bundleID);
          appsURL.searchParams.set('fields[apps]', 'bundleId');
          appsURL.searchParams.set('limit', '2');
          const apps = (await getPage(appsURL)).data || [];
          const matches = apps.filter(a => a.attributes?.bundleId === bundleID);
          if (matches.length !== 1) throw new Error(`Expected exactly one App Store Connect app for ${bundleID}; got ${matches.length}`);
          const appID = matches[0].id;
          
          const buildsURL = new URL(`/v1/apps/${encodeURIComponent(appID)}/builds`, API);
          buildsURL.searchParams.set('fields[builds]', 'version');
          buildsURL.searchParams.set('limit', '200');
          let nextURL = buildsURL.href;
          let maxExisting = 0;
          let pageCount = 0;
          while (nextURL) {
            if (++pageCount > 250) throw new Error('Too many App Store Connect build pages; refusing to guess a build number');
            const page = await getPage(nextURL);
            for (const build of (page.data || [])) {
              const version = build.attributes?.version;
              if (typeof version === 'string' && /^\d+$/.test(version)) {
                const number = Number(version);
                if (Number.isSafeInteger(number)) maxExisting = Math.max(maxExisting, number);
              }
            }
            nextURL = page.links?.next || null;
          }
          const workflowRunNumber = Number(runNum);
          if (!Number.isSafeInteger(workflowRunNumber) || workflowRunNumber < 1) throw new Error('Invalid GITHUB_RUN_NUMBER');
          const nextBuild = Math.max(maxExisting + 1, workflowRunNumber);
          if (!Number.isSafeInteger(nextBuild)) throw new Error('Build number exceeds safe integer range');
          appendFileSync(envFile, `BUILD_NUMBER=${nextBuild}\n`);
          console.log(`App Store Connect highest build: ${maxExisting}; next build: ${nextBuild}`);
          JS

      - name: Verify source and run unit tests
        run: |
          set -euo pipefail
          test -s project.yml
          test -s Config/Console-Info.plist
          python3 ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v
          # Existing Node tests are independent of iOS signing.
          if [[ -f MessageChain/tests/messagechain.test.mjs ]]; then
            node --test MessageChain/tests/*.test.mjs
          fi

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          test -d "$PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Compile and archive iOS Release
        env:
          SPYDER_CHAT_SERVER_URL: ${{ secrets.SPYDER_CHAT_SERVER_URL }}
        run: |
          set -euo pipefail
          # Chat server URL is public. It is injected into Info.plist at build time,
          # so users never need to type it on each iPhone after the Worker is deployed.
          if [[ -n "${SPYDER_CHAT_SERVER_URL:-}" ]]; then
            python3 - <<'PYVALIDATE'
          import os, urllib.parse
          url = urllib.parse.urlsplit(os.environ['SPYDER_CHAT_SERVER_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.query or url.fragment:
              raise SystemExit('SPYDER_CHAT_SERVER_URL must be a plain HTTPS endpoint')
          PYVALIDATE
          fi
          # No manual certificate import. Build an unsigned archive; the
          # distribution export below signs with Apple's cloud-managed identity.
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
            -jobs 2 \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            SPYDER_CHAT_SERVER_URL="${SPYDER_CHAT_SERVER_URL:-}" \
            SUPPORTS_MACCATALYST=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            archive
          APP="$RUNNER_TEMP/SpyderWallet.xcarchive/Products/Applications/Console.app"
          test -d "$APP" || { echo '::error::No iOS .app inside archive'; exit 1; }
          PLIST="$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "$DISPLAY_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          if [[ -n "${SPYDER_CHAT_SERVER_URL:-}" ]]; then
            REAL_CHAT_URL="$(/usr/libexec/PlistBuddy -c 'Print :SpyderChatServerURL' "$PLIST")"
            test "$REAL_CHAT_URL" = "$SPYDER_CHAT_SERVER_URL" || {
              echo '::error::Spyder Chat server URL was not included in app Info.plist'; exit 1;
            }
            echo 'Spyder Chat HTTPS endpoint embedded in the app.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::SPYDER_CHAT_SERVER_URL is not set; Chats will request the Worker URL at runtime.'
          fi
          echo "iOS Release compiled and archived: $APP_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Apple cloud-signing export configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'automatic',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          p = Path(os.environ['RUNNER_TEMP']) / 'SpyderExportOptions.plist'
          p.write_bytes(plistlib.dumps(options))
          PY
          plutil -lint "$RUNNER_TEMP/SpyderExportOptions.plist"

      - name: Cloud-sign and UPLOAD to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SpyderExport"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            -exportPath "$RUNNER_TEMP/SpyderExport" \
            -exportOptionsPlist "$RUNNER_TEMP/SpyderExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Xcode reported successful upload of Spyder Wallet $APP_VERSION ($BUILD_NUMBER)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Apple still needs to process the upload before it appears in TestFlight.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary API key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/spyder-private"
          rm -f "$RUNNER_TEMP/SpyderExportOptions.plist"
