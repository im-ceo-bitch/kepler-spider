name: Spyder Wallet - TestFlight Release

on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases against the same App Store Connect app simultaneously.
concurrency:
  group: spyder-wallet-testflight-release
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    runs-on: macos-26-intel
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.spyder.wallet
      APP_DISPLAY_NAME: Spyder Wallet
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Select verified Xcode 26.6 on Intel
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 || { echo '::error::Expected Intel macOS runner'; exit 1; }
          XCODE_APP=/Applications/Xcode_26.6.app
          test -d "$XCODE_APP/Contents/Developer" || {
            echo '::error::Xcode 26.6 is absent on this GitHub runner; inspect installed Xcode versions.'
            ls -d /Applications/Xcode* || true
            exit 1
          }
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes
          echo 'SIGNING_DIR='"$RUNNER_TEMP/spyder-signing" >> "$GITHUB_ENV"
          echo 'ARCHIVE_PATH='"$RUNNER_TEMP/SpyderWallet.xcarchive" >> "$GITHUB_ENV"
          echo 'EXPORT_PATH='"$RUNNER_TEMP/SpyderExport" >> "$GITHUB_ENV"

      - name: Read manually managed version; assign unique build number
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo '::error::Invalid GITHUB_RUN_NUMBER'; exit 1; }
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo '::error::Re-run jobs reuse the same build number; start a NEW workflow run instead.'
            exit 1
          fi
          APP_VERSION="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('project.yml').read_text(encoding='utf-8')
          matches = re.findall(r'^\s*MARKETING_VERSION:\s*[\x27\x22]?([0-9]+\.[0-9]+(?:\.[0-9]+)?)[\x27\x22]?\s*$', text, re.M)
          if len(matches) != 1:
              raise SystemExit('MARKETING_VERSION must be set once in project.yml, e.g. 1.0')
          print(matches[0])
          PY
          )"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "### Spyder Wallet $APP_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release version $APP_VERSION, build $BUILD_NUMBER"

      - name: Verify repository and signing validation tests
        run: |
          set -euo pipefail
          python3 ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v
          test -f project.yml
          test -f Config/Console-Info.plist
          test -f ci/signing.py

      # Fail early on missing/mismatched Apple credentials, before spending time compiling.
      - name: Validate Apple Distribution certificate, profile and API key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 ci/signing.py --out "$SIGNING_DIR" --bundle-id "$BUNDLE_ID"
          echo 'Apple Distribution profile, certificate and API key: basic validation passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
          xcodegen generate --spec project.yml
          test -d "$PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Compile entire iOS Release before signing
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
            -jobs 2 SUPPORTS_MACCATALYST=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          echo 'Release compilation passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install private Apple signing keychain and provisioning profile
        env:
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/spyder-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)-$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security import "$SIGNING_DIR/distribution.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          CERT_SHA1="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha1"])' "$SIGNING_DIR/metadata.json")"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES"
          grep -Fiq "$CERT_SHA1" <<< "$IDENTITIES" || {
            echo '::error::Matching Apple Distribution signing identity (certificate plus private key) missing from keychain'
            exit 1
          }
          PROFILE_UUID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["uuid"])' "$SIGNING_DIR/metadata.json")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGNING_DIR/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build signed App Store archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_NAME="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$SIGNING_DIR/metadata.json")"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
            -jobs 2 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SUPPORTS_MACCATALYST=NO archive
          APP="$ARCHIVE_PATH/Products/Applications/Console.app"
          test -d "$APP" || { echo '::error::Archive app is missing'; exit 1; }
          codesign --verify --strict --verbose=2 "$APP"
          PLIST="$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "$APP_DISPLAY_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          echo "Signed archive verified: $APP_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare App Store Connect upload options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          meta = json.loads((pathlib.Path(os.environ['SIGNING_DIR']) / 'metadata.json').read_text())
          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {os.environ['BUNDLE_ID']: meta['name']},
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'SpyderExportOptions.plist').open('wb') as f:
              plistlib.dump(options, f)
          PY
          plutil -lint "$RUNNER_TEMP/SpyderExportOptions.plist"

      - name: Upload signed Spyder Wallet to App Store Connect (TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$SIGNING_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          test -s "$KEY_PATH"
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/SpyderExportOptions.plist" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded $APP_VERSION ($BUILD_NUMBER) to App Store Connect for TestFlight processing." >> "$GITHUB_STEP_SUMMARY"
          echo 'Apple processing must finish before the build appears in TestFlight.' >> "$GITHUB_STEP_SUMMARY"

      - name: Securely remove temporary Apple signing materials
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -e "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${SIGNING_DIR:-}" ]]; then rm -rf "$SIGNING_DIR"; fi
          rm -f "$RUNNER_TEMP/SpyderExportOptions.plist"
