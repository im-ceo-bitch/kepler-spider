name: Spyder Wallet - Apple Signing Bot (p8 format fix)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run check first. Create only after API and Bundle ID validation passes."
        required: true
        type: choice
        default: check
        options:
          - check
          - create
      confirmation:
        description: "For create, type exactly: CREATE SPYDER SIGNING"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: spyder-apple-signing-bootstrap
  cancel-in-progress: false

jobs:
  signing:
    name: Apple Distribution / App Store profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Apple JWT client
        run: python -m pip install --disable-pip-version-check --quiet 'PyJWT[crypto]==2.10.1'

      - name: Validate Apple .p8 and bootstrap signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          SPYDER_BOT_MODE: ${{ inputs.mode }}
          SPYDER_CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY_SIGNING_BOT'
          #!/usr/bin/env python3
          """Spyder Wallet: safely bootstrap Apple Distribution signing in GitHub Actions.
          Never prints Apple API tokens, p8, p12, private keys or provisioning bytes.
          """
          import base64
          import json
          import os
          import pathlib
          import plistlib
          import secrets
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt
          from cryptography import x509
          from cryptography.x509.oid import NameOID

          API = 'https://api.appstoreconnect.apple.com/v1'
          BUNDLE = 'com.spyder.wallet'
          PROFILE_NAME = 'Spyder Wallet AppStore'
          TEAM = os.environ.get('APPLE_TEAM_ID', '').strip()
          ISSUER = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          KEY_ID = os.environ.get('APP_STORE_CONNECT_KEY_ID', '').strip()
          P8_BASE64 = os.environ.get('APP_STORE_CONNECT_API_KEY_BASE64', '').strip()
          REPO = os.environ.get('GITHUB_REPOSITORY', '').strip()
          MODE = os.environ.get('SPYDER_BOT_MODE', 'check')


          def fail(msg):
              print('::error::' + msg.replace('\n',' ')[:400], flush=True)
              raise SystemExit(1)


          def sh(args, input_bytes=None):
              result = subprocess.run(args, input=input_bytes, capture_output=True)
              if result.returncode:
                  fail(f'Local signing command failed: {args[0]} ({result.returncode}).')
              return result.stdout


          def parse_apple_private_key(raw):
              # GitHub Secrets may contain either a directly pasted .p8 PEM
              # or the Base64 encoding of the .p8 file. Neither is printed.
              from cryptography.hazmat.primitives import serialization
              from cryptography.hazmat.primitives.asymmetric import ec
              value = raw.strip()
              if not value:
                  fail('Missing APP_STORE_CONNECT_API_KEY_BASE64 in this repository Actions Secrets.')
              if value.startswith('-----BEGIN'):
                  pem = value.replace('\\n', '\n') if '\\n' in value else value
                  detected = 'PEM text'
              else:
                  compact = ''.join(value.split())
                  try:
                      pem = base64.b64decode(compact, validate=True).decode('utf-8')
                  except (ValueError, UnicodeError) as exc:
                      fail('APP_STORE_CONNECT_API_KEY_BASE64 is neither PEM .p8 nor valid Base64. '
                           'Copy the complete Apple AuthKey_*.p8 file into the GitHub Secret, '
                           'or Base64-encode the entire file; do not use the Key ID.')
                  detected = 'Base64 of PEM file'
              if not pem.strip().startswith('-----BEGIN PRIVATE KEY-----'):
                  fail('Secret decoded, but it is not an Apple AuthKey_*.p8 private key. '
                       'Use the complete file, not the Key ID, Issuer ID, JSON, or a distribution certificate.')
              try:
                  obj = serialization.load_pem_private_key(pem.encode('utf-8'), password=None)
              except (TypeError, ValueError):
                  fail('Apple .p8 PEM has invalid formatting or was truncated. '
                       'Copy the entire original AuthKey_*.p8 file, including BEGIN/END lines.')
              if not isinstance(obj, ec.EllipticCurvePrivateKey) or not isinstance(obj.curve, ec.SECP256R1):
                  fail('Private key is not an Apple App Store Connect EC P-256 .p8 key.')
              print('Apple API signing key format validated ('+detected+').', flush=True)
              return pem


          def require_credentials():
              fields = {'APPLE_TEAM_ID':TEAM, 'APP_STORE_CONNECT_ISSUER_ID':ISSUER,
                        'APP_STORE_CONNECT_KEY_ID':KEY_ID,'APP_STORE_CONNECT_API_KEY_BASE64':P8_BASE64}
              missing = [k for k,v in fields.items() if not v]
              if missing: fail('Missing GitHub Actions secrets: '+', '.join(missing))
              if not REPO or '/' not in REPO: fail('GITHUB_REPOSITORY unavailable.')
              if MODE not in ('check','create'): fail('Unsupported workflow mode.')
              return parse_apple_private_key(P8_BASE64)


          def token(key):
              now = int(time.time())
              return jwt.encode({'iss': ISSUER, 'iat': now-10, 'exp': now+600, 'aud':'appstoreconnect-v1'},
                                key, algorithm='ES256', headers={'kid':KEY_ID,'typ':'JWT'})


          def api(method, endpoint, key, body=None, params=None):
              url=API+endpoint
              if params: url+='?'+urllib.parse.urlencode(params)
              payload=json.dumps(body).encode('utf-8') if body is not None else None
              req=urllib.request.Request(url, data=payload, method=method,
                  headers={'Authorization':'Bearer '+token(key),'Accept':'application/json',
                           'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=35) as r:
                      data=r.read()
                      return json.loads(data) if data else {}
              except urllib.error.HTTPError as exc:
                  detail=''
                  try:
                      error_obj=json.loads(exc.read().decode('utf-8'))
                      detail='; '.join(str(x.get('code',''))+' '+str(x.get('title',''))
                                       for x in error_obj.get('errors',[])[:2])
                  except Exception: pass
                  fail(f'Apple API {method} {endpoint} HTTP {exc.code}. {detail}. '
                       'Check Team API Key role, account permissions and Bundle ID. (No credentials printed)')
              except Exception as exc:
                  fail(f'Apple API request failed ({type(exc).__name__}).')


          def get_bundle(key):
              response=api('GET','/bundleIds',key,params={'filter[identifier]':BUNDLE,'limit':'20'})
              found=[r for r in response.get('data',[]) if r.get('attributes',{}).get('identifier')==BUNDLE]
              if len(found)!=1: fail(f'Expected one registered Bundle ID {BUNDLE} in this Apple team; found {len(found)}.')
              return found[0]['id']


          def check_existing_profile(key):
              response=api('GET','/profiles',key,params={'filter[name]':PROFILE_NAME,'limit':'200'})
              profiles=[r for r in response.get('data',[]) if r.get('attributes',{}).get('name')==PROFILE_NAME]
              return profiles


          def check_github_token():
              if not os.environ.get('GH_TOKEN'): fail('Missing GH_SECRETS_PAT: required to write Actions Secrets automatically.')
              # Verify token can at least read the public encryption key. This does NOT prove write permission.
              sh(['gh','api',f'repos/{REPO}/actions/secrets/public-key','--silent'])


          def set_secret(name,value):
              # The secret is provided only over stdin; never echoed or printed.
              result=subprocess.run(['gh','secret','set',name,'--repo',REPO],
                                    input=value.encode('utf-8'),capture_output=True)
              if result.returncode:
                  fail('Failed to securely save '+name+' in GitHub Secrets; check GH_SECRETS_PAT has Secrets: read/write. '
                       'Do not re-run create blindly; a certificate may already exist.')
              print('Saved GitHub secret: '+name, flush=True)


          def write_summary(msg):
              path=os.environ.get('GITHUB_STEP_SUMMARY')
              if path:
                  with open(path,'a',encoding='utf-8') as f: f.write(msg+'\n')


          def create(key, bundle_id, folder):
              # Confirm the operator intentionally requested certificate issuance.
              if os.environ.get('SPYDER_CONFIRM')!='CREATE SPYDER SIGNING':
                  fail('Creation blocked. Supply exact confirmation: CREATE SPYDER SIGNING')
              previous=check_existing_profile(key)
              if previous:
                  fail('A profile named Spyder Wallet AppStore already exists. Refusing to create duplicate signing assets. '
                       'Inspect it in Apple Developer first.')
              check_github_token()
              priv=folder/'distribution.key'
              csr=folder/'distribution.csr'
              cert=folder/'distribution.cer'
              p12=folder/'distribution.p12'
              profile=folder/'distribution.mobileprovision'
              sh(['openssl','req','-new','-newkey','rsa:2048','-sha256','-nodes',
                  '-keyout',str(priv),'-out',str(csr),'-subj','/CN=Spyder Wallet Distribution'])
              os.chmod(priv,0o600)
              csr_text=csr.read_text('utf-8')
              cert_response=api('POST','/certificates',key,{
                  'data':{'type':'certificates','attributes':{'certificateType':'DISTRIBUTION',
                        'csrContent':csr_text}}})
              cert_data=cert_response['data']
              cert_id=cert_data['id']
              cert_der=base64.b64decode(cert_data['attributes']['certificateContent'],validate=True)
              cert.write_bytes(cert_der)
              sh(['openssl','x509','-inform','DER','-in',str(cert),'-out',str(folder/'distribution.pem')])
              cert_obj=x509.load_der_x509_certificate(cert_der)
              team_ous=[v.value for v in cert_obj.subject.get_attributes_for_oid(NameOID.ORGANIZATIONAL_UNIT_NAME)]
              if TEAM not in team_ous:
                  fail('Issued certificate has unexpected Apple Team ID (OU). New certificate may be orphaned; STOP, inspect Apple Developer.')
              pw=secrets.token_urlsafe(36)
              sh(['openssl','pkcs12','-export','-inkey',str(priv),'-in',str(folder/'distribution.pem'),
                  '-out',str(p12),'-name','Spyder Wallet Apple Distribution','-passout','pass:'+pw])
              # Persist certificate and private key BEFORE profile creation. No plaintext artifacts.
              set_secret('APPLE_DISTRIBUTION_P12_BASE64',base64.b64encode(p12.read_bytes()).decode())
              set_secret('APPLE_DISTRIBUTION_P12_PASSWORD',pw)
              print('Created new Apple Distribution certificate; private key saved in GitHub Secrets.',flush=True)
              profile_response=api('POST','/profiles',key,{
                  'data':{'type':'profiles','attributes':{'name':PROFILE_NAME,'profileType':'IOS_APP_STORE'},
                          'relationships':{
                              'bundleId':{'data':{'id':bundle_id,'type':'bundleIds'}},
                              'certificates':{'data':[{'id':cert_id,'type':'certificates'}]}
                          }}}
              )
              pd=profile_response['data']['attributes']
              profile.write_bytes(base64.b64decode(pd['profileContent'],validate=True))
              # Apple profile is a CMS-signed plist; read it without trusting arbitrary content.
              plist_bytes=sh(['openssl','cms','-verify','-noverify','-inform','DER','-in',str(profile)])
              pl=plistlib.loads(plist_bytes)
              ent=pl.get('Entitlements',{})
              app_id=ent.get('application-identifier', '')
              team_ids=pl.get('TeamIdentifier',[])
              if app_id!=TEAM+'.'+BUNDLE or TEAM not in team_ids:
                  fail('Provisioning profile Bundle ID / Team mismatch; refusing to store it.')
              if cert_der not in pl.get('DeveloperCertificates',[]):
                  fail('Provisioning profile does not contain the newly issued distribution certificate.')
              # App Group is optional until wired in Xcode; verify when present.
              groups=ent.get('com.apple.security.application-groups',[])
              if groups and 'group.com.spyder.wallet' not in groups:
                  fail('Provisioning profile App Groups do not match group.com.spyder.wallet.')
              set_secret('APPLE_APPSTORE_PROFILE_BASE64',base64.b64encode(profile.read_bytes()).decode())
              print('Created App Store provisioning profile for '+BUNDLE+'.',flush=True)
              write_summary('✅ New distribution certificate and App Store provisioning profile created for `'+BUNDLE+'`.')
              write_summary('GitHub Actions Secrets securely populated: `APPLE_DISTRIBUTION_P12_BASE64`, '
                            '`APPLE_DISTRIBUTION_P12_PASSWORD`, `APPLE_APPSTORE_PROFILE_BASE64`.')
              write_summary('Next: run the separate TestFlight workflow with build_only=false after Xcode build gate passes.')


          def main():
              key=require_credentials()
              bundle_id=get_bundle(key)
              print('New Apple account API access confirmed. Registered Bundle ID: '+BUNDLE,flush=True)
              if MODE=='check':
                  existing=check_existing_profile(key)
                  print(f'Check only: found {len(existing)} provisioning profile(s) named {PROFILE_NAME}.',flush=True)
                  write_summary('✅ Apple API authenticated and Bundle ID `'+BUNDLE+'` exists. No certificate or profile created.')
                  return
              # Use ephemeral runner temp; never upload or cache signing inputs.
              with tempfile.TemporaryDirectory(prefix='spyder-signing-',dir=os.environ.get('RUNNER_TEMP','/tmp')) as td:
                  folder=pathlib.Path(td)
                  os.chmod(folder,0o700)
                  create(key,bundle_id,folder)


          if __name__=='__main__': main()
          PY_SIGNING_BOT
