name: Spyder Wallet — TestFlight 1.0 (v2)

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'TRUE = compile only; FALSE = sign and upload to TestFlight'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: spyder-wallet-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build / Sign / Upload
    runs-on: macos-26-intel
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.spyder.wallet
      DISPLAY_NAME: Spyder Wallet
      # Edit manually when releasing a new version. Do not change for each build.
      MARKETING_VERSION: '1.0'
      # Unique, ascending number for each new run of this workflow.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # RUNNER_TEMP is available only after a job starts.  In particular,
      # the runner context is not available in jobs.<job_id>.env.
      - name: Initialize paths on runner
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          echo "SIGNING_DIR=$RUNNER_TEMP/spyder-signing" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/SpyderWallet.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/SpyderExport" >> "$GITHUB_ENV"

      - name: Set version and unique build number
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] && (( 10#$BUILD_NUMBER > 0 )) || {
            echo '::error::Invalid GitHub workflow run number'; exit 1;
          }
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo '::error::Invalid marketing version'; exit 1;
          }
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 && "$BUILD_ONLY" != true ]]; then
            echo '::error::A re-run retains the original build number. Use Actions > Run workflow to upload a new TestFlight build.'
            exit 1
          fi
          echo "Building Spyder Wallet ${MARKETING_VERSION} (${BUILD_NUMBER})"
          echo "### Spyder Wallet ${MARKETING_VERSION} (${BUILD_NUMBER})" >> "$GITHUB_STEP_SUMMARY"

      - name: Select working Xcode 26 on Intel runner
        run: |
          set -euo pipefail
          echo "Runner: $(uname -m) / macOS $(sw_vers -productVersion)"
          test "$(uname -m)" = x86_64 || { echo '::error::Expected macos-26-intel x86_64'; exit 1; }
          FOUND=''
          for APP in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            [[ -d "$APP/Contents/Developer" ]] || continue
            echo "Testing $APP"
            if OUTPUT="$(DEVELOPER_DIR="$APP/Contents/Developer" xcodebuild -version 2>&1)"; then
              printf '%s\n' "$OUTPUT"
              if grep -Eq '^Xcode 26([.]|$)' <<< "$OUTPUT"; then
                FOUND="$APP/Contents/Developer"
                break
              fi
            else
              echo "::warning::xcodebuild failed under $APP; checking next installation"
              printf '%s\n' "$OUTPUT" | tail -10
            fi
          done
          [[ -n "$FOUND" ]] || { echo '::error::No functioning Xcode 26 installation on this GitHub runner'; exit 1; }
          echo "DEVELOPER_DIR=$FOUND" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$FOUND" xcrun --sdk iphoneos --show-sdk-version

      - name: Verify Spyder source and tests
        run: |
          set -euo pipefail
          test -s project.yml
          test -s Config/Console-Info.plist
          test -s ci/signing.py
          grep -Eq '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER:[[:space:]]*com[.]spyder[.]wallet[[:space:]]*$' project.yml || {
            echo '::error::project.yml must contain com.spyder.wallet'; exit 1;
          }
          python3 ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v

      - name: Generate project with XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
          xcodegen generate --spec project.yml
          test -d "$PROJECT"

      - name: Build iOS Release unsigned (required CI gate)
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
            -jobs 2 SUPPORTS_MACCATALYST=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          echo 'iOS Release build passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate new Apple credentials and profile
        if: ${{ !inputs.build_only }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 ci/signing.py --out "$SIGNING_DIR" --bundle-id "$BUNDLE_ID"
          echo 'Apple profile, distribution certificate, Team ID and Bundle ID match.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Apple Distribution keychain and profile
        if: ${{ !inputs.build_only }}
        env:
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/spyder-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)-$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security import "$SIGNING_DIR/distribution.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"
          PROFILE_UUID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["uuid"])' "$SIGNING_DIR/metadata.json")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGNING_DIR/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive signed Spyder Wallet
        if: ${{ !inputs.build_only }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_NAME="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$SIGNING_DIR/metadata.json")"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
            -jobs 2 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SUPPORTS_MACCATALYST=NO \
            archive
          APP="$ARCHIVE_PATH/Products/Applications/Console.app"
          test -d "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          PLIST="$APP/Info.plist"
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          test "$ACTUAL_ID" = "$BUNDLE_ID" || { echo "::error::Wrong bundle: $ACTUAL_ID"; exit 1; }
          test "$ACTUAL_NAME" = "$DISPLAY_NAME" || { echo "::error::Wrong app display name: $ACTUAL_NAME"; exit 1; }
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          test "$ACTUAL_VERSION" = "$MARKETING_VERSION" || { echo "::error::Wrong version: $ACTUAL_VERSION (expected $MARKETING_VERSION). Check Config/Console-Info.plist"; exit 1; }
          test "$ACTUAL_BUILD" = "$BUILD_NUMBER" || { echo "::error::Wrong build number: $ACTUAL_BUILD (expected $BUILD_NUMBER). Check Config/Console-Info.plist"; exit 1; }
          echo "Signed archive passed: $DISPLAY_NAME $MARKETING_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Create App Store Connect export configuration
        if: ${{ !inputs.build_only }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          meta = json.loads((Path(os.environ['SIGNING_DIR']) / 'metadata.json').read_text())
          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {os.environ['BUNDLE_ID']: meta['name']},
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          with (Path(os.environ['RUNNER_TEMP']) / 'SpyderExportOptions.plist').open('wb') as f:
              plistlib.dump(options, f)
          PY
          plutil -lint "$RUNNER_TEMP/SpyderExportOptions.plist"

      - name: Upload signed app to TestFlight
        if: ${{ !inputs.build_only }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$SIGNING_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          test -s "$KEY_PATH"
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/SpyderExportOptions.plist" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'Upload command completed. Check App Store Connect > Spyder Wallet > TestFlight for Apple processing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build-only complete
        if: ${{ inputs.build_only }}
        run: echo 'Build-only passed. No signing and no upload.' >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary Apple secrets and keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN="${SIGNING_KEYCHAIN:-$RUNNER_TEMP/spyder-build.keychain-db}"
          if [[ -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -rf "$SIGNING_DIR" "$RUNNER_TEMP/SpyderExportOptions.plist"
