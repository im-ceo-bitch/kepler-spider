name: Spyder Wallet - TestFlight Cloud Signing

on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent concurrent uploads of the same version/build.
concurrency:
  group: spyder-wallet-testflight-cloud
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload Spyder Wallet to TestFlight
    runs-on: macos-26-intel
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.spyder.wallet
      DISPLAY_NAME: Spyder Wallet
      # GitHub increments this for each NEW execution of this workflow.
      # Editing the app version in project.yml is a separate, manual action.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out Spyder Wallet
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 on Intel
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64 || { echo '::error::Expected an Intel macOS runner'; exit 1; }
          XCODE_APP=/Applications/Xcode_26.6.app
          test -d "$XCODE_APP/Contents/Developer" || { echo '::error::Xcode 26.6 is not installed'; exit 1; }
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 26.6'
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check version and build number
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo '::error::Do not rerun the same job: use Run workflow again to get a NEW build number.'
            exit 1
          fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid build number'; exit 1; }
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('project.yml').read_text()
          versions = re.findall(r'^\s*MARKETING_VERSION:\s*["\']?([0-9]+(?:\.[0-9]+){1,2})["\']?\s*$', source, re.M)
          if len(versions) != 1:
              raise SystemExit('Expected one MARKETING_VERSION in project.yml (e.g. 1.0)')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'APP_VERSION={versions[0]}\n')
          print(f'App version is manually managed: {versions[0]}')
          print(f'Build number from GitHub: {os.environ["BUILD_NUMBER"]}')
          PY

      - name: Validate App Store Connect API credentials (NO P12)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for variable in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            [[ -n "${!variable:-}" ]] || { echo "::error::Missing GitHub secret: $variable"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/spyder-private"
          chmod 700 "$RUNNER_TEMP/spyder-private"
          python3 - <<'PY'
          import os, base64, binascii
          from pathlib import Path
          raw = os.environ['APP_STORE_CONNECT_API_KEY_BASE64'].strip()
          if raw.startswith('-----BEGIN PRIVATE KEY-----'):
              key = raw.encode('ascii')
          else:
              try:
                  key = base64.b64decode(''.join(raw.split()), validate=True)
              except (binascii.Error, ValueError):
                  raise SystemExit('APP_STORE_CONNECT_API_KEY_BASE64 is not valid Base64')
          if b'-----BEGIN PRIVATE KEY-----' not in key:
              raise SystemExit('The secret must contain a .p8 App Store Connect private key (not a .cer or .p12).')
          path = Path(os.environ['RUNNER_TEMP']) / 'spyder-private' / ('AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8')
          path.write_bytes(key)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'ASC_KEY_PATH={path}\n')
          PY
          openssl pkey -in "$RUNNER_TEMP/spyder-private/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" -noout >/dev/null 2>&1 || {
            echo '::error::Invalid App Store Connect .p8 private key.'; exit 1;
          }
          echo 'API key format verified. No P12 or provisioning profile is required in Secrets.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify source and run unit tests
        run: |
          set -euo pipefail
          test -s project.yml
          test -s Config/Console-Info.plist
          python3 ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v
          # Existing Node tests are independent of iOS signing.
          if [[ -f MessageChain/tests/messagechain.test.mjs ]]; then
            node --test MessageChain/tests/*.test.mjs
          fi

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          test -d "$PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Compile and archive iOS Release
        run: |
          set -euo pipefail
          # No manual certificate import. Build an unsigned archive; the
          # distribution export below signs with Apple's cloud-managed identity.
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
            -jobs 2 \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            SUPPORTS_MACCATALYST=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            archive
          APP="$RUNNER_TEMP/SpyderWallet.xcarchive/Products/Applications/Console.app"
          test -d "$APP" || { echo '::error::No iOS .app inside archive'; exit 1; }
          PLIST="$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = "$DISPLAY_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          echo "iOS Release compiled and archived: $APP_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Apple cloud-signing export configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'automatic',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          p = Path(os.environ['RUNNER_TEMP']) / 'SpyderExportOptions.plist'
          p.write_bytes(plistlib.dumps(options))
          PY
          plutil -lint "$RUNNER_TEMP/SpyderExportOptions.plist"

      - name: Cloud-sign and UPLOAD to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SpyderExport"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            -exportPath "$RUNNER_TEMP/SpyderExport" \
            -exportOptionsPlist "$RUNNER_TEMP/SpyderExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Xcode reported successful upload of Spyder Wallet $APP_VERSION ($BUILD_NUMBER)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Apple still needs to process the upload before it appears in TestFlight.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary API key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/spyder-private"
          rm -f "$RUNNER_TEMP/SpyderExportOptions.plist"
