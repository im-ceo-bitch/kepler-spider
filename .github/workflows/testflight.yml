name: Spyder Wallet — Intel Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'App version for TestFlight'
        required: true
        default: '1.3.0'
        type: string
      build_only:
        description: 'Compile without Apple signing or TestFlight upload'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: spyder-wallet-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Compile / Sign / Upload (Intel)
    runs-on: macos-26-intel
    timeout-minutes: 85
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          XCODE_VERSION="$(xcodebuild -version)"
          echo "Architecture: $ARCH"
          printf '%s\n' "$XCODE_VERSION"
          if [ "$ARCH" != 'x86_64' ]; then
            echo "::error::Expected Intel x86_64 macOS runner, got $ARCH"
            exit 1
          fi
          if [[ "$XCODE_VERSION" != Xcode\ 26.* ]]; then
            echo '::error::Xcode 26 is required'
            exit 1
          fi

      - name: Validate source before compilation
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          test -f Config/Console-Info.plist
          test -d Console
          if [ -f ci/verify_repo.py ]; then
            python3 ci/verify_repo.py
          fi
          if [ -f server/src/index.mjs ]; then
            node --check server/src/index.mjs
          elif [ -f server/src/index.js ]; then
            node --check server/src/index.js
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"

      - name: Compile Debug and Release without signing
        shell: bash
        run: |
          set -euo pipefail
          for CONFIG in Debug Release; do
            echo "::group::Compile $CONFIG for iOS Simulator"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              SUPPORTS_MACCATALYST=NO \
              build
            echo '::endgroup::'
          done

      - name: Verify App Store Connect API credentials
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_VALUE: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for KEY in APPLE_TEAM_ID KEY_ID ISSUER_ID API_KEY_VALUE; do
            if [ -z "${!KEY:-}" ]; then
              echo "::error::Missing Apple API credential: $KEY"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/spyder-asc"
          export KEY_PATH="$RUNNER_TEMP/spyder-asc/AuthKey_${KEY_ID}.p8"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ['API_KEY_VALUE'].strip()
          try:
              contents = raw.encode() if 'BEGIN PRIVATE KEY' in raw else base64.b64decode(''.join(raw.split()), validate=True)
              text = contents.decode('utf-8')
              if '-----BEGIN PRIVATE KEY-----' not in text or '-----END PRIVATE KEY-----' not in text:
                  raise ValueError('Missing PEM private key markers')
          except (ValueError, UnicodeError) as exc:
              raise SystemExit('::error::Invalid APP_STORE_CONNECT_API_KEY_BASE64 (expected .p8 or base64 .p8)') from exc
          Path(os.environ['KEY_PATH']).write_text(text.strip() + '\n', encoding='utf-8')
          PY
          chmod 600 "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive iPhone and iPad with automatic signing
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/SpyderWallet.xcarchive"
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))"
          echo "Building $MARKETING_VERSION ($BUILD_NUMBER)"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            SUPPORTS_MACCATALYST=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive
          test -d "$ARCHIVE_PATH"

      - name: Verify App Store identity
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          set -euo pipefail
          INFO="$RUNNER_TEMP/SpyderWallet.xcarchive/Products/Applications/Console.app/Info.plist"
          test -f "$INFO"
          GOT_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          GOT_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")"
          echo "App identity: $GOT_NAME ($GOT_BUNDLE)"
          if [ "$GOT_BUNDLE" != "$BUNDLE_ID" ] || [ "$GOT_NAME" != 'Spyder Wallet' ]; then
            echo '::error::App identity mismatch; refusing TestFlight upload'
            exit 1
          fi

      - name: Create automatic signing export options
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          opts = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'automatic',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'SpyderExportOptions.plist'
          with path.open('wb') as f:
              plistlib.dump(opts, f)
          PY
          plutil -lint "$RUNNER_TEMP/SpyderExportOptions.plist"

      - name: Export and upload to TestFlight
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SpyderExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            -exportPath "$RUNNER_TEMP/SpyderExport" \
            -exportOptionsPlist "$RUNNER_TEMP/SpyderExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo 'Export/upload submitted; check TestFlight processing in App Store Connect.'

      - name: Build-only finished
        if: ${{ inputs.build_only }}
        shell: bash
        run: echo 'Debug and Release builds passed. Signing and upload skipped by request.'

      - name: Clean temporary API key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$RUNNER_TEMP/spyder-asc"
          fi
