name: Spyder Wallet — New Apple ID TestFlight (Intel)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'App version for new Spyder Wallet app'
        required: true
        default: '1.3.0'
        type: string
      build_only:
        description: 'Compile Debug/Release without signing; run this first'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: spyder-new-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Validate / Compile / Sign / Upload (Intel)
    runs-on: macos-26-intel
    timeout-minutes: 110
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.spyder.wallet
      APP_NAME: Spyder Wallet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Intel runner and Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          xcodebuild -version
          test "$(uname -m)" = "x86_64" || { echo '::error::Intel macOS runner required'; exit 1; }
          xcodebuild -version | grep -q '^Xcode 26\.' || { echo '::error::Xcode 26 required'; exit 1; }

      - name: Validate repository and signing tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v
          test -f project.yml
          test -f Config/Console-Info.plist
          grep -Eq '^ *PRODUCT_BUNDLE_IDENTIFIER: com\.spyder\.wallet *$' project.yml
          if [ -f server/package.json ]; then
            (cd server && npm test --if-present && npm run check --if-present)
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
          xcodegen generate
          test -d "$PROJECT"

      - name: Build Debug and Release for iOS Simulator (unsigned CI gate)
        shell: bash
        run: |
          set -euo pipefail
          for CONFIG in Debug Release; do
            echo "::group::${CONFIG} simulator compile"
            xcodebuild \
              -project "$PROJECT" -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/SpyderDerivedData" \
              SUPPORTS_MACCATALYST=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
            echo '::endgroup::'
          done

      - name: Validate new Apple Team distribution credentials
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 ci/signing.py --out "$RUNNER_TEMP/spyder-signing" --bundle-id "$BUNDLE_ID"

      - name: Install new Apple Distribution certificate and profile
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING="$RUNNER_TEMP/spyder-signing"
          KEYCHAIN="$RUNNER_TEMP/spyder-build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)-$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security import "$SIGNING/distribution.p12" -k "$KEYCHAIN" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["uuid"])' "$SIGNING/metadata.json")"
          cp "$SIGNING/distribution.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          SIGNING="$RUNNER_TEMP/spyder-signing"
          PROFILE_NAME="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$SIGNING/metadata.json")"
          BUILD_NUMBER="$((200 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))"
          echo "Building Spyder Wallet $MARKETING_VERSION ($BUILD_NUMBER) under $BUNDLE_ID"
          xcodebuild \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SUPPORTS_MACCATALYST=NO \
            archive
          APP="$RUNNER_TEMP/SpyderWallet.xcarchive/Products/Applications/Console.app"
          test -d "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          INFO="$APP/Info.plist"
          GOT_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          GOT_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")"
          test "$GOT_BUNDLE" = "$BUNDLE_ID" || { echo "::error::Wrong signed bundle ID: $GOT_BUNDLE"; exit 1; }
          test "$GOT_NAME" = "$APP_NAME" || { echo "::error::Wrong display name: $GOT_NAME"; exit 1; }
          echo "Signed archive verified: $GOT_NAME ($GOT_BUNDLE)"

      - name: Prepare App Store Connect export options
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          meta = json.loads((Path(os.environ['RUNNER_TEMP'])/'spyder-signing'/'metadata.json').read_text())
          opts = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {os.environ['BUNDLE_ID']: meta['name']},
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          target = Path(os.environ['RUNNER_TEMP'])/'SpyderExportOptions.plist'
          with target.open('wb') as stream: plistlib.dump(opts, stream)
          PY
          plutil -lint "$RUNNER_TEMP/SpyderExportOptions.plist"

      - name: Upload signed build to App Store Connect
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/spyder-signing/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          test -s "$API_KEY_PATH"
          mkdir -p "$RUNNER_TEMP/SpyderExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/SpyderWallet.xcarchive" \
            -exportPath "$RUNNER_TEMP/SpyderExport" \
            -exportOptionsPlist "$RUNNER_TEMP/SpyderExportOptions.plist" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'Upload command succeeded. Confirm TestFlight processing in App Store Connect.'

      - name: Build-only passed
        if: ${{ inputs.build_only }}
        shell: bash
        run: echo 'Unsigned Debug and Release simulator builds passed; nothing uploaded.'

      - name: Clean ephemeral signing files and keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/spyder-signing" "$RUNNER_TEMP/SpyderExportOptions.plist"
