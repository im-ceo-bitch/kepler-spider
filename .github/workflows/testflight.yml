name: Spyder Wallet - Intel TestFlight (Verified Signing)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown in TestFlight'
        required: true
        default: '1.3.0'
        type: string
      build_only:
        description: 'Only verify Debug and Release compilation; do not sign/upload'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: spyder-wallet-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build / Sign / TestFlight (Intel macOS)
    runs-on: macos-26-intel
    timeout-minutes: 75
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta
      SIGNING_DIR: ${{ runner.temp }}/spyder-signing
      ARCHIVE_PATH: ${{ runner.temp }}/SpyderWallet.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/SpyderWalletExport

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Intel runner and Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo '::error::Expected Intel runner (x86_64)'; exit 1
          fi
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 26\.' || {
            echo '::error::Expected Xcode 26'; exit 1;
          }

      - name: Validate repository content
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_repo.py
          python3 -m py_compile ci/signing.py ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v
          if command -v node >/dev/null 2>&1; then
            node --check server/src/index.js
          fi

      - name: Check distribution signing inputs before building
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 ci/signing.py --out "$SIGNING_DIR" --bundle-id "$BUNDLE_ID"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"
          test -f Config/Console-Info.plist

      - name: Compile Debug and Release for iOS Simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          for config in Debug Release; do
            echo "::group::Compile $config"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$config" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              SUPPORTS_MACCATALYST=NO \
              build
            echo '::endgroup::'
          done

      - name: Import Apple Distribution signing identity and provisioning profile
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/spyder-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/distribution.p12" \
            -k "$KEYCHAIN_PATH" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          PROFILE_UUID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["uuid"])' "$SIGNING_DIR/metadata.json")"
          CERT_SHA1="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha1"])' "$SIGNING_DIR/metadata.json")"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$SIGNING_DIR/distribution.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$CERT_SHA1" || {
            echo '::error::Apple Distribution identity not found in temporary keychain after importing P12'; exit 1;
          }
          echo "SPYDER_SIGNING_CERT_SHA1=$CERT_SHA1" >> "$GITHUB_ENV"
          echo 'Apple Distribution certificate and profile are installed and match.'

      - name: Archive for iOS with deterministic distribution signing
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          PROFILE_NAME="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$SIGNING_DIR/metadata.json")"
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "Archive version $MARKETING_VERSION ($BUILD_NUMBER)"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            SPYDER_SIGNING_CERT_SHA1="$SPYDER_SIGNING_CERT_SHA1" \
            SPYDER_SIGNING_PROFILE_NAME="$PROFILE_NAME" \
            SUPPORTS_MACCATALYST=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Verify signed archive and application identity
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/Console.app"
          INFO_PLIST="$APP/Info.plist"
          test -f "$INFO_PLIST"
          ACTUAL_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")"
          if [ "$ACTUAL_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "::error::Incorrect bundle ID: $ACTUAL_BUNDLE"; exit 1
          fi
          if [ "$ACTUAL_NAME" != 'Spyder Wallet' ]; then
            echo "::error::Incorrect app display name: $ACTUAL_NAME"; exit 1
          fi
          test -f "$APP/embedded.mobileprovision" || {
            echo '::error::Archive has no embedded provisioning profile'; exit 1;
          }
          codesign --verify --strict --deep "$APP"
          echo "Verified signed archive: $ACTUAL_NAME ($ACTUAL_BUNDLE)"

      - name: Generate manual App Store Connect export options
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          profile = json.loads((Path(os.environ['SIGNING_DIR']) / 'metadata.json').read_text())
          export = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'signingCertificate': profile['sha1'],
              'provisioningProfiles': {os.environ['BUNDLE_ID']: profile['name']},
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          with open(Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist', 'wb') as fp:
              plistlib.dump(export, fp)
          PY
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed build to TestFlight
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$SIGNING_DIR/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo 'Apple accepted the export/upload command. Check App Store Connect for processing.'

      - name: Build-only outcome
        if: ${{ inputs.build_only }}
        shell: bash
        run: echo 'Debug and Release simulator builds passed. TestFlight signing/upload was intentionally skipped.'

      - name: Clean temporary signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/spyder-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SIGNING_DIR" "$RUNNER_TEMP/ExportOptions.plist"
          echo 'Temporary signing material cleared.'
