name: Spyder Wallet - Intel TestFlight (Build Fix)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version shown in TestFlight'
        required: true
        default: '1.3.0'
        type: string
      build_only:
        description: 'Compile Debug and Release only; skip signing/upload'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: spyder-wallet-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build / Sign / TestFlight (Intel macOS)
    runs-on: macos-26-intel
    timeout-minutes: 75
    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize temporary paths
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?GitHub runner RUNNER_TEMP is missing}"
          {
            printf 'SIGNING_DIR=%s\n' "$RUNNER_TEMP/spyder-signing"
            printf 'ARCHIVE_PATH=%s\n' "$RUNNER_TEMP/SpyderWallet.xcarchive"
            printf 'EXPORT_PATH=%s\n' "$RUNNER_TEMP/SpyderWalletExport"
          } >> "$GITHUB_ENV"

      - name: Verify Intel runner and Xcode 26 (without broken pipes)
        shell: bash
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          echo "Runner architecture: $ARCH"
          if [ "$ARCH" != 'x86_64' ]; then
            echo "::error::Expected Intel runner x86_64, got $ARCH"
            exit 1
          fi
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          if [[ "$XCODE_VERSION_OUTPUT" != Xcode\ 26.* ]]; then
            echo '::error::Expected Xcode 26'
            exit 1
          fi

      - name: Validate source tree and server syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/verify_repo.py
          python3 -m py_compile ci/signing.py ci/verify_repo.py
          python3 -m unittest discover -s ci/tests -v
          if command -v node >/dev/null 2>&1; then
            if [ -f server/src/index.mjs ]; then
              node --check server/src/index.mjs
            elif [ -f server/src/index.js ]; then
              node --check server/src/index.js
            else
              echo '::error::Missing Spyder Chat server entry point (index.mjs/index.js)'
              exit 1
            fi
          fi

      - name: Validate signing inputs (upload jobs only)
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 ci/signing.py --out "$SIGNING_DIR" --bundle-id "$BUNDLE_ID"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.yml
          xcodegen generate
          test -d "$PROJECT"
          test -f Config/Console-Info.plist

      - name: Compile Debug and Release for iOS Simulator (no signing)
        shell: bash
        run: |
          set -euo pipefail
          for config in Debug Release; do
            echo "::group::Compile $config"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$config" \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              SUPPORTS_MACCATALYST=NO \
              build
            echo '::endgroup::'
          done

      - name: Install validated Apple Distribution identity and profile
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/spyder-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/distribution.p12" \
            -k "$KEYCHAIN_PATH" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          PROFILE_UUID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["uuid"])' "$SIGNING_DIR/metadata.json")"
          CERT_SHA1="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha1"])' "$SIGNING_DIR/metadata.json")"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$SIGNING_DIR/distribution.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          # Capture complete output before searching: grep -q can break pipes under pipefail.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          if [[ "$IDENTITIES" != *"$CERT_SHA1"* ]]; then
            echo '::error::Apple Distribution identity missing after P12 import'
            exit 1
          fi
          echo 'Distribution identity and provisioning profile installed.'

      - name: Archive Release iOS application
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          PROFILE_NAME="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$SIGNING_DIR/metadata.json")"
          BUILD_NUMBER="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          echo "Archive version $MARKETING_VERSION ($BUILD_NUMBER)"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            SUPPORTS_MACCATALYST=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Verify signed archive identity
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/Console.app"
          INFO_PLIST="$APP/Info.plist"
          test -f "$INFO_PLIST"
          ACTUAL_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")"
          if [ "$ACTUAL_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "::error::Incorrect bundle ID: $ACTUAL_BUNDLE"
            exit 1
          fi
          if [ "$ACTUAL_NAME" != 'Spyder Wallet' ]; then
            echo "::error::Incorrect display name: $ACTUAL_NAME"
            exit 1
          fi
          test -f "$APP/embedded.mobileprovision"
          codesign --verify --strict --deep "$APP"
          echo "Verified signed archive: $ACTUAL_NAME ($ACTUAL_BUNDLE)"

      - name: Generate manual App Store Connect export options
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          profile = json.loads((Path(os.environ['SIGNING_DIR']) / 'metadata.json').read_text())
          export = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'signingCertificate': profile['sha1'],
              'provisioningProfiles': {os.environ['BUNDLE_ID']: profile['name']},
              'manageAppVersionAndBuildNumber': False,
              'stripSwiftSymbols': True,
              'uploadSymbols': True,
          }
          with open(Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist', 'wb') as fp:
              plistlib.dump(export, fp)
          PY
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export and upload to TestFlight
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$SIGNING_DIR/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo 'Upload command completed; check TestFlight processing in App Store Connect.'

      - name: Build-only completion
        if: ${{ inputs.build_only }}
        shell: bash
        run: echo 'Debug and Release simulator builds succeeded; TestFlight upload skipped.'

      - name: Clean signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/spyder-signing.keychain-db" 2>/dev/null || true
          if [ -n "${SIGNING_DIR:-}" ] && [ "$SIGNING_DIR" = "$RUNNER_TEMP/spyder-signing" ]; then
            rm -rf "$SIGNING_DIR"
          fi
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
          echo 'Temporary signing material cleared.'
