name: Spyder Wallet - Intel TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App version
        required: true
        default: "1.3.0"
        type: string

permissions:
  contents: read

concurrency:
  group: console-testflight-ios
  cancel-in-progress: false

jobs:
  testflight:
    name: Intel macOS - Build & Upload iPhone + iPad
    runs-on: macos-26-intel
    timeout-minutes: 60

    env:
      PROJECT: Console.xcodeproj
      SCHEME: Console
      BUNDLE_ID: com.console.beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Intel runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "x86_64" || { echo "::error::This workflow requires an Intel macOS runner"; exit 1; }
          echo "Installed Xcode applications:"
          ls -d /Applications/Xcode*.app || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)"
          test -n "$XCODE_APP" || { echo "::error::Xcode not found"; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Validate secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          CONSOLE_IOS_PROFILE_BASE64: ${{ secrets.CONSOLE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for key in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            APPLE_DISTRIBUTION_P12_BASE64 \
            APPLE_DISTRIBUTION_P12_PASSWORD \
            CONSOLE_IOS_PROFILE_BASE64
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "$PROJECT"

      - name: Prepare App Store Connect API key
        id: asc_key
        shell: bash
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          export KEY_PATH API_KEY_BASE64

          python3 -c 'import base64,os,pathlib; raw=os.environ["API_KEY_BASE64"]; data=raw.encode() if "BEGIN PRIVATE KEY" in raw else base64.b64decode("".join(raw.split())); pathlib.Path(os.environ["KEY_PATH"]).write_bytes(data)'

          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Apple Distribution certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/console-signing.keychain-db"
          KEYCHAIN_PASSWORD="console-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          P12_PATH="$RUNNER_TEMP/console-distribution.p12"

          export P12_PATH P12_BASE64

          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["P12_PATH"]).write_bytes(base64.b64decode("".join(os.environ["P12_BASE64"].split())))'

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::Apple Distribution certificate not found in P12"
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install iOS provisioning profile
        id: profile
        shell: bash
        env:
          PROFILE_BASE64: ${{ secrets.CONSOLE_IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          PROFILE_RAW="$RUNNER_TEMP/console-ios.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/console-ios-profile.plist"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          export PROFILE_RAW PROFILE_BASE64

          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["PROFILE_RAW"]).write_bytes(base64.b64decode("".join(os.environ["PROFILE_BASE64"].split())))'

          security cms -D -i "$PROFILE_RAW" > "$PROFILE_PLIST"

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile Team ID mismatch"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "::error::Provisioning profile Bundle ID mismatch: $PROFILE_APP_ID"
            exit 1
          fi

          cp "$PROFILE_RAW" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Build preflight
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=NO \
            build

      - name: Archive iPhone + iPad
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Console.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            SUPPORTS_MACCATALYST=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Verify archive identity and display name
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/Console.xcarchive/Products/Applications/Console.app/Info.plist"
          test -f "$INFO_PLIST"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          ACTUAL_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")"
          if [ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "::error::Bundle identifier changed unexpectedly: $ACTUAL_BUNDLE_ID"
            exit 1
          fi
          if [ "$ACTUAL_DISPLAY_NAME" != "Spyder Wallet" ]; then
            echo "::error::Display name mismatch: $ACTUAL_DISPLAY_NAME"
            exit 1
          fi

      - name: Create export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        shell: bash
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_PATH: ${{ steps.asc_key.outputs.path }}
        run: |
          set -euo pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Console.xcarchive" \
            -exportPath "$RUNNER_TEMP/ConsoleExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Cleanup signing keychain
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
