name: Console
options:
  createIntermediateGroups: true

packages:
  BIP39MnemonicKit:
    url: https://github.com/devdasx/bip39-mnemonic-kit.git
    exactVersion: 2.0.1
  WalletCore:
    path: Packages/WalletCore

targets:
  Console:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Console
    dependencies:
      - package: BIP39MnemonicKit
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet
        PRODUCT_NAME: Console
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 200
        SWIFT_VERSION: 5.10

        # One SwiftUI product for iPhone + iPad + Mac Catalyst.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"

        # Explicit plist preserves the existing Apple application record and allows rebranding.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Console-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - ConsoleTests

  ConsoleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Console
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet.tests
