name: Console
options:
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  BIP39MnemonicKit:
    url: https://github.com/devdasx/bip39-mnemonic-kit.git
    exactVersion: 2.0.1
  WalletCore:
    path: Packages/WalletCore
  SpyderNativeCollection:
    path: Packages/SpyderNativeCollection

targets:
  Console:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Console
        excludes:
          - Features/Chats/SpyderOriginals.swift
          - Features/Chats/SpyderChatTerminalView.swift
          - Features/Chats/SpyderGlobalTerminalView.swift
          - Features/Chats/SpyderTerminalChatContainer.swift
      - path: Shared/SpyderID
    dependencies:
      - target: SpyderAutoFill
        embed: true
      - target: SpyderSafari
        embed: true
      - target: SpyderShare
        embed: true
      - package: BIP39MnemonicKit
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
      - package: SpyderNativeCollection
        product: SpyderNativeCollection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet
        PRODUCT_NAME: Console
        SWIFT_VERSION: 5.10

        # One SwiftUI product for iPhone + iPad + Mac Catalyst.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"

        # Explicit plist preserves the existing Apple application record and allows rebranding.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Console-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Console.entitlements
    scheme:
      testTargets:
        - ConsoleTests

  ConsoleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Console
      - package: SpyderNativeCollection
        product: SpyderNativeCollection
      - package: WalletCore
        product: WalletCore
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet.tests

  SpyderAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/SpyderAutoFill
      - path: Shared/SpyderID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet.id.autofill
        PRODUCT_MODULE_NAME: SpyderAutoFill
        PRODUCT_NAME: SpyderAutoFill
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/SpyderAutoFill-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SpyderAutoFill.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  SpyderSafari:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/SpyderSafari
        excludes:
          - Resources
      - path: Extensions/SpyderSafari/Resources
        type: group
        buildPhase: resources
      - path: Shared/SpyderID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet.id.safari
        PRODUCT_MODULE_NAME: SpyderSafari
        PRODUCT_NAME: SpyderSafari
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/SpyderSafari-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SpyderSafari.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  SpyderShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/SpyderShare
      - path: Shared/SpyderID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spyder.wallet.id.share
        PRODUCT_MODULE_NAME: SpyderShare
        PRODUCT_NAME: SpyderShare
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/SpyderShare-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SpyderShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
