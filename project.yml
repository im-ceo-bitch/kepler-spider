name: Console
options:
  createIntermediateGroups: true

targets:
  Console:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Console
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.console.beta
        PRODUCT_NAME: Console
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 5.10

        # One SwiftUI product for iPhone + iPad + Mac Catalyst.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"

        # Explicit plist preserves the existing Apple application record and allows rebranding.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Console-Info.plist
        CONSOLE_SERVER_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
