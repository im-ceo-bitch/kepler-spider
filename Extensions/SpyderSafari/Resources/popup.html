<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Spyder ID</title></head><body>
<header><h1>Spyder ID</h1><p id="site"></p></header>
<p id="status" role="status" aria-live="polite">Откройте страницу входа или регистрации.</p>
<label>Название аккаунта<input id="title" autocomplete="off" maxlength="500"></label>
<label>Логин<input id="username" autocomplete="off" autocapitalize="none" maxlength="4096"></label>
<button id="generate" class="primary">Создать и заполнить пароль</button>
<button id="save">Сохранить введённый пароль</button>
<button id="list">Мои аккаунты на этом сайте</button>
<section id="accounts" aria-label="Сохранённые аккаунты"></section>
<p class="hint">Сначала включите сейф в Spyder Wallet. При создании пароль сохраняется как черновик. После регистрации подтвердите его здесь или в приложении.</p>
<script src="form.js"></script><script src="popup.js"></script></body></html>
